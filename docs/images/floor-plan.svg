<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2328">Floor-plan editor — layout primitives</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#57606a">Rooms are modelled from three reusable primitives: seats, doors and windows</text>

  <!-- room -->
  <rect x="60" y="100" width="620" height="400" fill="#fbfcfd" stroke="#3a4351" stroke-width="3"/>

  <!-- windows (top wall) -->
  <g fill="#dff0ff" stroke="#5aa9e6" stroke-width="2">
    <rect x="140" y="94" width="70" height="12"/>
    <rect x="260" y="94" width="70" height="12"/>
    <rect x="380" y="94" width="70" height="12"/>
    <rect x="500" y="94" width="70" height="12"/>
  </g>
  <!-- door (right wall) -->
  <rect x="674" y="270" width="14" height="80" fill="#fff2cc" stroke="#d9a520" stroke-width="2"/>
  <path d="M674 350 A80 80 0 0 0 594 270" fill="none" stroke="#d9a520" stroke-dasharray="4 4"/>

  <!-- seats -->
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <g fill="#e7eefb" stroke="#7aa2e8" stroke-width="1.2">
      <rect x="100" y="140" width="54" height="42" rx="4"/><rect x="180" y="140" width="54" height="42" rx="4"/><rect x="260" y="140" width="54" height="42" rx="4"/><rect x="340" y="140" width="54" height="42" rx="4"/><rect x="420" y="140" width="54" height="42" rx="4"/><rect x="500" y="140" width="54" height="42" rx="4"/><rect x="580" y="140" width="54" height="42" rx="4"/>
      <rect x="100" y="230" width="54" height="42" rx="4"/><rect x="180" y="230" width="54" height="42" rx="4"/><rect x="260" y="230" width="54" height="42" rx="4"/><rect x="340" y="230" width="54" height="42" rx="4"/><rect x="420" y="230" width="54" height="42" rx="4"/><rect x="500" y="230" width="54" height="42" rx="4"/><rect x="580" y="230" width="54" height="42" rx="4"/>
      <rect x="100" y="320" width="54" height="42" rx="4"/><rect x="180" y="320" width="54" height="42" rx="4"/><rect x="260" y="320" width="54" height="42" rx="4"/><rect x="340" y="320" width="54" height="42" rx="4"/><rect x="420" y="320" width="54" height="42" rx="4"/><rect x="500" y="320" width="54" height="42" rx="4"/><rect x="580" y="320" width="54" height="42" rx="4"/>
      <rect x="100" y="410" width="54" height="42" rx="4"/><rect x="180" y="410" width="54" height="42" rx="4"/><rect x="260" y="410" width="54" height="42" rx="4"/><rect x="340" y="410" width="54" height="42" rx="4"/><rect x="420" y="410" width="54" height="42" rx="4"/><rect x="500" y="410" width="54" height="42" rx="4"/><rect x="580" y="410" width="54" height="42" rx="4"/>
    </g>
    <g>
      <text x="127" y="166">1</text><text x="207" y="166">2</text><text x="287" y="166">3</text><text x="367" y="166">4</text><text x="447" y="166">5</text><text x="527" y="166">6</text><text x="607" y="166">7</text>
      <text x="127" y="256">8</text><text x="207" y="256">9</text><text x="287" y="256">10</text><text x="367" y="256">11</text><text x="447" y="256">12</text><text x="527" y="256">13</text><text x="607" y="256">14</text>
      <text x="127" y="346">15</text><text x="207" y="346">16</text><text x="287" y="346">17</text><text x="367" y="346">18</text><text x="447" y="346">19</text><text x="527" y="346">20</text><text x="607" y="346">21</text>
      <text x="127" y="436">22</text><text x="207" y="436">23</text><text x="287" y="436">24</text><text x="367" y="436">25</text><text x="447" y="436">26</text><text x="527" y="436">27</text><text x="607" y="436">28</text>
    </g>
  </g>
  <text x="370" y="486" text-anchor="middle" font-size="13" fill="#8a929c">Common aisle space is shared across the seats it serves</text>

  <!-- side panel -->
  <rect x="710" y="100" width="240" height="400" rx="10" fill="#f7f9fb" stroke="#cfd4da"/>
  <text x="730" y="132" font-size="15" font-weight="700" fill="#1f2328">Primitives</text>

  <rect x="730" y="148" width="26" height="20" rx="3" fill="#e7eefb" stroke="#7aa2e8"/>
  <text x="768" y="163" font-size="13" fill="#3a4351">SEAT — chargeable workstation</text>

  <rect x="730" y="182" width="26" height="20" rx="3" fill="#fff2cc" stroke="#d9a520"/>
  <text x="768" y="197" font-size="13" fill="#3a4351">DOOR — access point</text>

  <rect x="730" y="216" width="26" height="20" rx="3" fill="#dff0ff" stroke="#5aa9e6"/>
  <text x="768" y="231" font-size="13" fill="#3a4351">WINDOW — perimeter element</text>

  <line x1="730" y1="258" x2="930" y2="258" stroke="#cfd4da"/>
  <text x="730" y="286" font-size="15" font-weight="700" fill="#1f2328">Room summary</text>
  <text x="730" y="314" font-size="13" fill="#3a4351">Seats: counted from SEAT primitives</text>
  <text x="730" y="338" font-size="13" fill="#3a4351">Doors / windows: counted separately</text>
  <text x="730" y="362" font-size="13" fill="#3a4351">Area: room area + aisle share</text>
  <text x="730" y="386" font-size="13" fill="#3a4351">Status: OPEN / CLOSED</text>

  <line x1="730" y1="410" x2="930" y2="410" stroke="#cfd4da"/>
  <text x="730" y="438" font-size="12.5" fill="#57606a">Seat-months and the shared-area charge are</text>
  <text x="730" y="458" font-size="12.5" fill="#57606a">computed from occupancy history, not re-entered</text>
  <text x="730" y="478" font-size="12.5" fill="#57606a">by hand.</text>
</svg>
