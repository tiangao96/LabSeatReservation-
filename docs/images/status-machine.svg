<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2328">Workstation status state machine</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#57606a">Only valid transitions are accepted; OCCUPIED and PRE_RESERVED cannot be set manually</text>

  <g font-size="14">
    <rect x="70" y="170" width="170" height="70" rx="12" fill="#eef4ff" stroke="#7aa2e8" stroke-width="1.5"/>
    <text x="155" y="212" text-anchor="middle" font-weight="700" fill="#0b4bb0">IDLE</text>

    <rect x="415" y="80" width="170" height="70" rx="12" fill="#fff8ec" stroke="#e7c26b" stroke-width="1.5"/>
    <text x="500" y="122" text-anchor="middle" font-weight="700" fill="#9a6700">PRE_RESERVED</text>

    <rect x="415" y="270" width="170" height="70" rx="12" fill="#fdeef0" stroke="#e08aa8" stroke-width="1.5"/>
    <text x="500" y="312" text-anchor="middle" font-weight="700" fill="#b3245a">OCCUPIED</text>

    <rect x="760" y="80" width="170" height="70" rx="12" fill="#f4f4f6" stroke="#a9b1ba" stroke-width="1.5"/>
    <text x="845" y="122" text-anchor="middle" font-weight="700" fill="#3a4351">MAINTENANCE</text>

    <rect x="760" y="270" width="170" height="70" rx="12" fill="#f4f4f6" stroke="#a9b1ba" stroke-width="1.5"/>
    <text x="845" y="312" text-anchor="middle" font-weight="700" fill="#3a4351">DISABLED</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M240 195 L411 128" marker-end="url(#c)"/>
    <text x="300" y="145" font-size="11.5" fill="#57606a">reserve</text>

    <path d="M500 150 L500 266" marker-end="url(#c)"/>
    <text x="510" y="212" font-size="11.5" fill="#57606a">activate</text>

    <path d="M585 285 L760 300" marker-end="url(#c)"/>
    <text x="640" y="322" font-size="11.5" fill="#57606a">maintain / retire</text>

    <path d="M760 100 L590 105" marker-end="url(#c)"/>
    <text x="640" y="86" font-size="11.5" fill="#57606a">restore</text>

    <path d="M415 300 L245 235" marker-end="url(#c)"/>
    <text x="290" y="292" font-size="11.5" fill="#57606a">release</text>

    <path d="M155 240 L155 380 L845 380 L845 344" marker-end="url(#c)"/>
    <text x="330" y="400" font-size="11.5" fill="#57606a">automatic release on student graduation</text>
  </g>
</svg>
