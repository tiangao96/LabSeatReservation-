<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2328">Seat allocation workflow</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#57606a">From a mentor-group request to an accounted, then released, workstation</text>

  <g font-size="13">
    <rect x="36" y="110" width="160" height="92" rx="10" fill="#eef4ff" stroke="#b6c8f2"/>
    <text x="116" y="146" text-anchor="middle" font-weight="700" fill="#0b4bb0">1 · Request</text>
    <text x="116" y="170" text-anchor="middle" fill="#3a4351">mentor selects lab,</text>
    <text x="116" y="188" text-anchor="middle" fill="#3a4351">seats and months</text>

    <rect x="228" y="110" width="160" height="92" rx="10" fill="#f0f8f1" stroke="#b7dcbd"/>
    <text x="308" y="146" text-anchor="middle" font-weight="700" fill="#1a7f37">2 · Validate</text>
    <text x="308" y="170" text-anchor="middle" fill="#3a4351">availability and</text>
    <text x="308" y="188" text-anchor="middle" fill="#3a4351">conflict checks</text>

    <rect x="420" y="110" width="160" height="92" rx="10" fill="#fff8ec" stroke="#f0d9a8"/>
    <text x="500" y="146" text-anchor="middle" font-weight="700" fill="#9a6700">3 · Review</text>
    <text x="500" y="170" text-anchor="middle" fill="#3a4351">administrator</text>
    <text x="500" y="188" text-anchor="middle" fill="#3a4351">approves / rejects</text>

    <rect x="612" y="110" width="160" height="92" rx="10" fill="#fdeef0" stroke="#e7bed0"/>
    <text x="692" y="146" text-anchor="middle" font-weight="700" fill="#b3245a">4 · Occupy</text>
    <text x="692" y="170" text-anchor="middle" fill="#3a4351">occupancy history</text>
    <text x="692" y="188" text-anchor="middle" fill="#3a4351">row written</text>

    <rect x="804" y="110" width="160" height="92" rx="10" fill="#eef4ff" stroke="#b6c8f2"/>
    <text x="884" y="146" text-anchor="middle" font-weight="700" fill="#0b4bb0">5 · Account</text>
    <text x="884" y="170" text-anchor="middle" fill="#3a4351">monthly seat-months</text>
    <text x="884" y="188" text-anchor="middle" fill="#3a4351">and shared area</text>

    <rect x="420" y="300" width="160" height="92" rx="10" fill="#f4f4f6" stroke="#cfd4da"/>
    <text x="500" y="336" text-anchor="middle" font-weight="700" fill="#3a4351">Rejected</text>
    <text x="500" y="360" text-anchor="middle" fill="#3a4351">request recorded,</text>
    <text x="500" y="378" text-anchor="middle" fill="#3a4351">seats stay available</text>

    <rect x="612" y="300" width="160" height="92" rx="10" fill="#f0f8f1" stroke="#b7dcbd"/>
    <text x="692" y="336" text-anchor="middle" font-weight="700" fill="#1a7f37">6 · Release</text>
    <text x="692" y="360" text-anchor="middle" fill="#3a4351">term end or graduation</text>
    <text x="692" y="378" text-anchor="middle" fill="#3a4351">returns seats to IDLE</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <line x1="196" y1="156" x2="224" y2="156" marker-end="url(#b)"/>
    <line x1="388" y1="156" x2="416" y2="156" marker-end="url(#b)"/>
    <line x1="580" y1="156" x2="608" y2="156" marker-end="url(#b)"/>
    <line x1="772" y1="156" x2="800" y2="156" marker-end="url(#b)"/>
    <path d="M500 202 L500 296" marker-end="url(#b)"/>
    <path d="M692 202 L692 296" marker-end="url(#b)"/>
  </g>
  <text x="510" y="256" font-size="11.5" fill="#57606a">rejected</text>
  <text x="702" y="256" font-size="11.5" fill="#57606a">term end / graduation</text>

  <text x="500" y="466" text-anchor="middle" font-size="12.5" fill="#8a929c">The floor plan, occupancy records and monthly statistics are all derived from the same occupancy history, so no figure is re-entered by hand.</text>
</svg>
