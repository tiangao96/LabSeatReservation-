# 生产环境配置（随 jar 打包，--spring.profiles.active=prod 时由 Spring 加载）。
# 仅含 ${...} 占位符，无任何敏感值，可入库。真实值由 lab-deploy.sh 从 config/app.env /
# config/rsa.env source 成环境变量后，Spring 启动时解析。无默认值的占位符为必填
# （缺则启动报 "Could not resolve placeholder"）；有默认值的可选。
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:lab_reservation}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

# prod 开启登录密码 RSA 加密；公私钥 ${RSA_PUBLIC_KEY} / ${RSA_PRIVATE_KEY} 由
# config/rsa.env 注入（占位符定义在 application.yml，此处只翻 enabled）。
app:
  crypto:
    rsa:
      enabled: true

logging:
  level:
    com.lab: INFO
